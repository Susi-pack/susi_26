# Default/template config for src/tools/metsakeskus_to_allometry/metsakeskus_to_allometry.py.
#
# Reads Metsäkeskus's 2026 .gpkg format. For an old-format file, use
# metsakeskus_to_allometry_old_format.py instead.
#
# Copy this file, fill in the four REQUIRED fields for your project, and
# pass it via --config.
#
# Every other field is optional.
# metsakeskus_to_allometry.py already applies the value shown here if the
# key is omitted entirely. 

# --- Required, no code-level default ---

# Which inventory snapshot year to use. Example: 2005.
target_year = 0 # REQUIRED

# Site elevation, metres.
# Enforced range: [0, 1000]
altitude = -1 # REQUIRED

# Degree-day-years, cumulative temperature sum.
# Enforced range: [500, 2000]
ddy = 0 # REQUIRED

# Keep stands whose mean diameter, cm, is in [minimum, maximum]; this leaves out stands too young or too old.
# No default: the right range depends on the region. Example for Pirkanmaa only: [8, 21].
# Explained at https://susi-pack.github.io/susi_26/metsakeskus_to_allometry/#mean-diameter-range
mean_diameter_range_filter = [] # REQUIRED

# --- Optional -- shown here with the same values parse_extraction_config()
# --- would apply anyway if the key were simply absent from this file.

# Which peatland fertility classes to keep. Restricting to 2-5 excludes the
# very richest and very poorest extremes.
# Codes: the .gpkg's codeschema_mapping table, field fertilityclass.
fertilityclass_filter = [2, 3, 4, 5]

# n_trees, start_year, end_year, step_years all feed
# Growth_and_Yield_Table.get_table(): how many trees the allometric model
# tracks, and the age range/step of the growth trajectory it returns.
n_trees = 20
start_year = 5
end_year = 80
step_years = 5

# --- Optional: dense young stand scaling (off by default) ---
# Explained at https://susi-pack.github.io/susi_26/dense_young_stand_scaling/
[dense_young_stand_scaling]
# Scale down the stems and basal area of dense young stands before the growth model runs.
enabled = false

# Only stands with a mean diameter below this are scaled, cm.
max_mean_diameter = 8.0

# A stand is scaled when its stem count is above this, stems/ha (by main species).
stem_count_threshold_spruce = 2200
stem_count_threshold_other = 2500

# The stem count a scaled stand starts from, stems/ha (by main species).
target_stem_count_spruce = 1800
target_stem_count_other = 2000
