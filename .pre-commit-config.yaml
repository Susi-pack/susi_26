# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Fail on (and convert) any CRLF line ending, not just mixed files.
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        # Only strip outputs from the analysis notebooks and the testing
        # projects' notebooks (their figures come from untracked data).
        files: ^(src/analysis/notebooks|test_projects)/.*\.ipynb$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check

  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.84
    hooks:
      - id: ty
