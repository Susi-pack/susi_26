[project]
name = "susi-26"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "netcdf4>=1.7.4",
    "numpy>=2.4.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pareto-dp>=0.1.7",
    "pydantic>=2.12.5",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
    "xlrd>=2.0.2",
    "geopandas>=1.1.4",
    "xmltodict>=1.0.4",
]

[project.urls]
Documentation = "https://susi-pack.github.io/susi_26/"
Repository = "https://github.com/Susi-pack/susi_26"
Issues = "https://github.com/Susi-pack/susi_26/issues"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "griffe-pydantic>=1.3.1",
    "hypothesis>=6.152.9",
    "mkdocstrings[python]>=1.0.4",
    "nbstripout>=0.9.1",
    "pre-commit>=4.0.1",
    "pytest>=9.0.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "zensical>=0.0.66",
]
notebook = [
    "jupyterlab>=4.6,<5",
    "ipykernel>=6.30",
    "ipyfilechooser>=0.6.0",
    "ipywidgets>=8.1.8",
]
ui = ["streamlit>=1.19.0", "streamlit-tree-select>=0.0.5"]

[tool.uv]
default-groups = ["dev", "notebook", "ui"]
# The version comes from git (setuptools-scm), so rebuild the editable install
# on new commits and tags too, not only when pyproject.toml changes.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]


[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["susi*", "analysis*", "tools*"]
namespaces = true

[tool.setuptools_scm]
fallback_version = "0.0.0"


[project.scripts]
susi-init-project = "tools.init_project.init_project:main"
susi-xml-to-allometry = "tools.xml_to_allometry.xml_to_allometry:main"
susi-metsakeskus-to-allometry = "tools.metsakeskus_to_allometry.metsakeskus_to_allometry:main"
susi-metsakeskus-to-allometry-old-format = "tools.metsakeskus_to_allometry_old_format.metsakeskus_to_allometry_old_format:main"
susi-new-growth-allometry = "tools.new_growth_allometry.new_growth_allometry:main"

[tool.ty.environment]
# Notebooks import their project's sibling modules (e.g. figures_2021.ipynb's
# `from parameters_2021 import ...`). ty resolves those for a .py script next
# to them, but not for a notebook, so their folders are listed here.
extra-paths = ["test_projects/susi_2021"]

[tool.ty.src]
include = [
    "src",
    "tests",
    "test_projects",
    "example_projects",
    "src/susi/core/main.py",
]
exclude = [
    "src/susi/core/allometric_road_map.py",
    "src/susi/core/allometry.py",
    "src/susi/core/canopygrid.py",
    "src/susi/core/canopylayer.py",
    "src/susi/core/esom.py",
    "src/susi/core/gvegetation.py",
    "src/susi/core/methane.py",
    "src/susi/core/mosslayer.py",
    "src/susi/core/stand.py",
    "src/susi/core/stem_curve.py",
    "src/susi/core/strip.py",
    "src/susi/core/susi_utils.py",
    "src/susi/core/temperature.py",
    "src/susi/core/weibull_recovery.py",
    "src/susi/core/metsi/naslund.py",
    "src/susi/core/thinning_models.py",
    "src/analysis/scrapbook.py",
    "src/analysis/figures.py",
]

[tool.ruff]
exclude = ["src/analysis/figures.py", "src/analysis/scrapbook.py"]

[tool.ruff.lint]
ignore = ["DTZ001", "DTZ005", "SIM113"]

[tool.pytest]
# Name of the folders in which to look for tests.
testpaths = ["tests"]

# Test groups: plain `pytest` runs only the fast one, i.e., neither "slow" nor "golden" tests.
# See docs/internal/running_tests.md.
markers = [
    "slow: takes over 0.5 s on its own, or runs a full SUSI simulation",
    "golden: compares a run's output against a stored reference output",
]

addopts = ["--doctest-modules", "-m", "not slow and not golden"]
