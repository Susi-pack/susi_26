[project]
name = "susi-26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["susi*"]
namespaces = false

[tool.ty.src]
include = ["src", "tests"]
exclude = [
    "src/susi/core",
    "src/susi/io/susi_io.py",
    "src/scripts/susi_calls_scenarios.py",
    "src/inputs/susi_para.py",
]

[tool.pytest]
testpaths = ["tests"] # only look under the tests/ folder for tests
